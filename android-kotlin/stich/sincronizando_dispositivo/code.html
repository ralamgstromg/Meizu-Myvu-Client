<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MYVU Sync</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#3b494b",
                        "on-primary-fixed-variant": "#004f54",
                        "on-tertiary-fixed-variant": "#5e289b",
                        "secondary-fixed": "#d6e5e9",
                        "inverse-primary": "#006970",
                        "primary": "#dbfcff",
                        "primary-container": "#00f0ff",
                        "on-tertiary-container": "#7743b5",
                        "surface-container": "#1e2022",
                        "on-secondary": "#253336",
                        "surface-variant": "#333537",
                        "on-secondary-container": "#acbbbf",
                        "tertiary": "#fcf2ff",
                        "tertiary-fixed": "#eedbff",
                        "primary-fixed": "#7df4ff",
                        "on-primary-container": "#006970",
                        "outline": "#849495",
                        "on-secondary-fixed-variant": "#3c494d",
                        "error-container": "#93000a",
                        "on-tertiary": "#460283",
                        "inverse-surface": "#e2e2e5",
                        "surface-container-low": "#1a1c1e",
                        "on-error": "#690005",
                        "surface-dim": "#121416",
                        "inverse-on-surface": "#2f3133",
                        "surface-container-lowest": "#0c0e10",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#dab9ff",
                        "surface": "#121416",
                        "secondary": "#bac9cd",
                        "surface-container-highest": "#333537",
                        "background": "#121416",
                        "tertiary-container": "#e7d0ff",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#2a0053",
                        "on-primary-fixed": "#002022",
                        "on-background": "#e2e2e5",
                        "on-secondary-fixed": "#101e21",
                        "secondary-container": "#3e4b4f",
                        "surface-container-high": "#282a2c",
                        "surface-bright": "#37393b",
                        "primary-fixed-dim": "#00dbe9",
                        "surface-tint": "#00dbe9",
                        "on-surface-variant": "#b9cacb",
                        "on-surface": "#e2e2e5",
                        "secondary-fixed-dim": "#bac9cd",
                        "on-primary": "#00363a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "gutter": "16px",
                        "stack-lg": "24px",
                        "base": "8px",
                        "stack-sm": "4px",
                        "stack-md": "12px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "label-md": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "700" }],
                        "headline-sm": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-ring {
            animation: pulse-ring 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .pulse-core {
            animation: pulse-core 3s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes pulse-core {
            0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px rgba(0, 240, 255, 0.8); }
            100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-surface-container-low text-on-surface font-body-lg min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-primary-container/10 via-background to-background pointer-events-none"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center p-container-padding text-center w-full max-w-md">
<!-- Synchronization Graphic -->
<div class="relative w-48 h-48 mb-stack-lg flex items-center justify-center fade-in-up" style="animation-delay: 0.1s;">
<!-- Outer Pulsing Rings -->
<div class="absolute inset-0 rounded-full border border-primary-container/30 pulse-ring"></div>
<div class="absolute inset-4 rounded-full border border-primary-container/50 pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Core Energy Orb -->
<div class="relative z-10 w-24 h-24 rounded-full bg-primary-container/20 border border-primary-container pulse-core flex items-center justify-center backdrop-blur-md">
<span class="material-symbols-outlined text-primary-container text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    bluetooth_connected
                </span>
</div>
<!-- Connection Lines (Decorative) -->
<svg class="absolute inset-0 w-full h-full -z-10" fill="none" viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<circle class="animate-[spin_20s_linear_infinite]" cx="100" cy="100" r="80" stroke="url(#paint0_linear)" stroke-dasharray="4 8" stroke-width="1"></circle>
<circle class="animate-[spin_30s_linear_infinite_reverse]" cx="100" cy="100" r="95" stroke="url(#paint1_linear)" stroke-dasharray="2 12" stroke-width="1"></circle>
<defs>
<lineargradient gradientunits="userSpaceOnUse" id="paint0_linear" x1="100" x2="100" y1="20" y2="180">
<stop stop-color="#00f0ff" stop-opacity="0.8"></stop>
<stop offset="1" stop-color="#00f0ff" stop-opacity="0"></stop>
</lineargradient>
<lineargradient gradientunits="userSpaceOnUse" id="paint1_linear" x1="100" x2="100" y1="5" y2="195">
<stop stop-color="#00f0ff" stop-opacity="0"></stop>
<stop offset="1" stop-color="#00f0ff" stop-opacity="0.5"></stop>
</lineargradient>
</defs>
</svg>
</div>
<!-- Typography -->
<div class="fade-in-up flex flex-col gap-stack-sm" style="animation-delay: 0.3s;">
<h1 class="font-headline-sm text-headline-sm text-primary-container">Sincronizando con MYVU Air...</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Estableciendo conexión encriptada y calibrando sensores
            </p>
</div>
<!-- Progress Indicator -->
<div class="mt-stack-lg w-48 h-1 bg-surface-container-high rounded-full overflow-hidden fade-in-up" style="animation-delay: 0.5s;">
<div class="h-full bg-primary-container rounded-full w-1/3 relative shadow-[0_0_8px_rgba(0,240,255,0.8)] animate-[pulse-width_2s_ease-in-out_infinite_alternate]">
<!-- Glow tip -->
<div class="absolute right-0 top-0 bottom-0 w-4 bg-white/50 blur-[2px]"></div>
</div>
</div>
<style>
            @keyframes pulse-width {
                0% { width: 10%; }
                100% { width: 90%; }
            }
        </style>
<!-- Technical Details (Optional Minimalist touch) -->
<div class="mt-auto pt-16 fade-in-up" style="animation-delay: 0.7s;">
<span class="font-label-md text-label-md text-outline px-4 py-1 rounded-full bg-surface-container-high/50 border border-outline-variant/30 flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
                 SECURE_LINK_ACTIVE
             </span>
</div>
</main>
</body></html>
